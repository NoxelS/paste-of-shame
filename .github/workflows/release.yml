name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-app:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python 3.10
      run: uv python install 3.10

    - name: Install dependencies
      run: |
        uv sync
        uv sync --group macos-app

    - name: Run tests
      run: uv run pytest

    - name: Build standalone macOS app
      run: |
        mv pyproject.toml pyproject.toml.bak
        uv run python setup.py py2app
        mv pyproject.toml.bak pyproject.toml

    - name: Verify app bundle
      run: |
        if [ ! -d "dist/Paste of Shame.app" ]; then
          echo "App bundle not created!"
          exit 1
        fi
        echo "App size: $(du -sh 'dist/Paste of Shame.app' | cut -f1)"

    - name: Create DMG installer
      run: bash scripts/create_dmg.sh

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Rename DMG with version
      run: |
        mv dist/Paste-of-Shame.dmg "dist/PasteOfShame-${{ steps.get_version.outputs.VERSION }}-macOS.dmg"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: dist/PasteOfShame-*.dmg
        retention-days: 30

    - name: Calculate checksums
      run: |
        cd dist
        shasum -a 256 PasteOfShame-*.dmg > checksums.txt
        cat checksums.txt

    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: checksums
        path: dist/checksums.txt

  create-release:
    needs: build-macos-app
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download DMG artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-dmg
        path: dist

    - name: Download checksums
      uses: actions/download-artifact@v4
      with:
        name: checksums
        path: dist

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release Notes
      run: |
        cat > release_notes.md << 'EOF'
        # Paste of Shame v${{ steps.get_version.outputs.VERSION }}

        ## 📦 Downloads

        ### macOS Application
        - **PasteOfShame-${{ steps.get_version.outputs.VERSION }}-macOS.dmg** - Universal macOS application (requires macOS 10.15+)

        ## Installation

        ### macOS
        1. Download the DMG file
        2. Open the DMG
        3. Drag "Paste of Shame.app" to Applications folder
        4. Launch from Applications or Spotlight
        5. Click the ⚠️ icon in menu bar and select "Start Watching"

        ## What's New

        See [CHANGES.md](https://github.com/${{ github.repository }}/blob/main/CHANGES.md) for detailed changelog.

        ## Verification

        SHA256 checksums are included in the checksums.txt file.

        ## Support

        - Report issues: https://github.com/${{ github.repository }}/issues
        - Documentation: https://github.com/${{ github.repository }}/blob/main/README.md
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release v${{ steps.get_version.outputs.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: |
          dist/PasteOfShame-*.dmg
          dist/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
