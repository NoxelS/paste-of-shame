name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-app:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python 3.10
      run: uv python install 3.10

    - name: Install dependencies
      run: |
        uv sync
        uv sync --group macos-app

    - name: Run tests
      run: uv run pytest

    - name: Build standalone macOS app
      run: |
        mv pyproject.toml pyproject.toml.bak
        uv run python setup.py py2app
        mv pyproject.toml.bak pyproject.toml

    - name: Verify app bundle
      run: |
        if [ ! -d "dist/Paste of Shame.app" ]; then
          echo "App bundle not created!"
          exit 1
        fi
        echo "App size: $(du -sh 'dist/Paste of Shame.app' | cut -f1)"

    - name: Create DMG installer
      run: bash scripts/create_dmg.sh

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Verify DMG was created
      run: |
        if [ ! -f "dist/Paste-of-Shame-${{ steps.get_version.outputs.VERSION }}-macOS.dmg" ]; then
          echo "DMG file not found!"
          ls -la dist/
          exit 1
        fi
        echo "DMG created: dist/Paste-of-Shame-${{ steps.get_version.outputs.VERSION }}-macOS.dmg"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-dmg
        path: dist/Paste-of-Shame-*.dmg
        retention-days: 30

    - name: Calculate checksums
      run: |
        cd dist
        shasum -a 256 Paste-of-Shame-*.dmg > checksums.txt
        cat checksums.txt

    - name: Upload checksums
      uses: actions/upload-artifact@v4
      with:
        name: checksums
        path: dist/checksums.txt

  create-release:
    needs: build-macos-app
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download DMG artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-dmg
        path: dist

    - name: Download checksums
      uses: actions/download-artifact@v4
      with:
        name: checksums
        path: dist

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release Notes
      run: |
        cat > release_notes.md << 'EOF'
        # Paste of Shame v${{ steps.get_version.outputs.VERSION }}

        ## 📦 Downloads

        ### macOS Application
        - **Paste-of-Shame-${{ steps.get_version.outputs.VERSION }}-macOS.dmg** - Universal macOS application (requires macOS 10.15+)


        ## 📦 Installation

        <div align="center">

        ### macOS Application

        **Native menu bar app with instant notifications**

        <a href="https://github.com/NoxelS/paste-of-shame/releases/latest/download/Paste-of-Shame-0.1.0-macOS.dmg">
          <img src="https://img.shields.io/badge/Download%20DMG-10.15+-0071e3?style=for-the-badge&logo=apple&logoColor=white" alt="Download DMG" height="50">
        </a>

        <br>
        <sub>Universal Binary • ~10MB • macOS 10.15 (Catalina) or later</sub>

        </div>

        <br>

        **Installation Steps:**

        1. Download the DMG file above
        2. Open the downloaded DMG
        3. Drag **Paste of Shame.app** to your Applications folder
        4. Launch from Applications or Spotlight (⌘+Space)
        5. **Grant permission to open the app:**
          - Open **System Settings** → **Privacy & Security**
          - Scroll down to find: *"Paste of Shame was blocked..."*
          - Click **"Open Anyway"** → Enter password → Click **"Open"**
        6. Click the the icon in your menu bar and select **Start Watching**

        That's it! You'll get instant notifications when LLM boilerplate is detected in your clipboard.

        > **ℹ️ Why the security warning?** The app is not yet notarized by Apple (enrollment in progress). It's completely safe - the code is [open source](https://github.com/NoxelS/paste-of-shame) and auditable. Future releases will be fully notarized for seamless installation.

        ### 🚀 Auto-Start on Login (Optional)

        Make Paste of Shame launch automatically when you log in:

        #### **Method 1: System Settings** (Recommended)

        <table>
        <tr>
        <td width="60px" align="center">1️⃣</td>
        <td>Open <strong>System Settings</strong> → <strong>General</strong> → <strong>Login Items</strong></td>
        </tr>
        <tr>
        <td align="center">2️⃣</td>
        <td>Click the <strong>"+"</strong> button under "Open at Login"</td>
        </tr>
        <tr>
        <td align="center">3️⃣</td>
        <td>Select <strong>"Paste of Shame"</strong> from Applications</td>
        </tr>
        <tr>
        <td align="center">✅</td>
        <td>Done! The app will now start automatically on every login</td>
        </tr>
        </table>

        #### **Method 2: Terminal Command** (Advanced)

        If you have the repository cloned:

        ```bash
        cd /path/to/paste-of-shame
        make install-launchagent
        ```

        **To disable auto-start later:**
        ```bash
        make uninstall-launchagent
        ```

        <details>
        <summary>💡 What does this do? (click to expand)</summary>

        This creates a LaunchAgent plist file at:
        ```
        ~/Library/LaunchAgents/com.pasteofshame.app.plist
        ```

        The LaunchAgent tells macOS to automatically launch Paste of Shame when you log in. It's a standard macOS mechanism for background applications.

        **To verify it's installed:**
        ```bash
        launchctl list | grep pasteofshame
        ```

        **To manually uninstall:**
        ```bash
        launchctl unload ~/Library/LaunchAgents/com.pasteofshame.app.plist
        rm ~/Library/LaunchAgents/com.pasteofshame.app.plist
        ```

        </details>

        ---

        **Advanced: Command Line Installation**

        <details>
        <summary>Install via curl (click to expand)</summary>

        ```bash
        # Download and install latest release
        curl -L https://github.com/NoxelS/paste-of-shame/releases/latest/download/Paste-of-Shame-0.1.0-macOS.dmg -o PasteOfShame.dmg
        open PasteOfShame.dmg
        # Drag to Applications folder
        ```

        </details>


        ## What's New

        See [CHANGES.md](https://github.com/${{ github.repository }}/blob/main/CHANGES.md) for detailed changelog.

        ## Verification

        SHA256 checksums are included in the checksums.txt file.

        ## Support

        - Report issues: https://github.com/${{ github.repository }}/issues
        - Documentation: https://github.com/${{ github.repository }}/blob/main/README.md
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release v${{ steps.get_version.outputs.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: false
        files: |
          dist/Paste-of-Shame-*.dmg
          dist/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
