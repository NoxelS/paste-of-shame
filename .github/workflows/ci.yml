name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python 3.10
      run: uv python install 3.10

    - name: Install dependencies
      run: uv sync

    - name: Check lock file
      run: uv lock --locked

    - name: Run linting
      run: uv run ruff check pasteofshame

    - name: Run formatting check
      run: uv run ruff format --check pasteofshame

    - name: Run type checking
      run: uv run mypy pasteofshame

    - name: Check dependencies
      run: uv run deptry .

    - name: Run tests with coverage
      run: uv run pytest --cov=pasteofshame --cov-report=term --cov-report=html

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/
        retention-days: 7
