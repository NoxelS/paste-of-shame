[project]
name = "paste-of-shame"
version = "0.0.1"
description = "Paste of Shame - Clipboard watchdog that detects LLM-generated boilerplate"
authors = [{ name = "Noel Schwabenland", email = "noel@schwabenland.ch" }]
readme = "README.md"
keywords = ['clipboard', 'llm', 'detection', 'paste', 'guard']
requires-python = ">=3.10,<3.11"
dependencies = [
    "pyperclip>=1.9.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.scripts]
paste-of-shame = "pasteofshame.cli.main:main"

[project.urls]
Homepage = "https://NoxelS.github.io/paste-of-shame/"
Repository = "https://github.com/NoxelS/paste-of-shame"
Documentation = "https://NoxelS.github.io/paste-of-shame/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.5.1",
    "tox-uv>=1.29.0",
    "deptry>=0.24.0",
    "mypy>=1.19.1",
    "types-PyYAML>=6.0.12",
    "ruff>=0.14.10",
]
macos-app = [
    "py2app>=0.28.0",
    "rumps>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pasteofshame"]

[tool.mypy]
files = ["pasteofshame"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true


