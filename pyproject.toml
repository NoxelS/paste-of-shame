[project]
name = "paste-of-shame"
version = "0.1.1"
description = "Paste of Shame - Clipboard watchdog that detects LLM-generated boilerplate"
authors = [{ name = "Noel Schwabenland", email = "noel@schwabenland.ch" }]
readme = "README.md"
keywords = ['clipboard', 'llm', 'detection', 'paste', 'guard']
requires-python = "~=3.10.0"
dependencies = [
    "pyperclip>=1.9.0",
    "pyyaml>=6.0.1",
    "click>=8.1.0",
    "regex>=2024.0.0",
    "pyahocorasick>=2.1.0",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.scripts]
paste-of-shame = "pasteofshame.cli.main:main"

[project.urls]
Homepage = "https://NoxelS.github.io/paste-of-shame/"
Repository = "https://github.com/NoxelS/paste-of-shame"
Documentation = "https://NoxelS.github.io/paste-of-shame/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.5.1",
    "deptry>=0.24.0",
    "mypy>=1.19.1",
    "types-PyYAML>=6.0.12",
    "ruff>=0.14.10",
    "pytest-benchmark>=5.2.3",
]
macos-app = [
    "py2app>=0.28.0",
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",  # For native NSPasteboard support
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pasteofshame"]

[tool.mypy]
files = ["pasteofshame"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = false  # Allow unused ignores for optional dependencies
show_error_codes = true

[[tool.mypy.overrides]]
module = "pasteofshame.app.macos_app"
disallow_any_unimported = false
ignore_missing_imports = true  # Ignore missing rumps in CI

[[tool.mypy.overrides]]
module = "pkg_resources"
ignore_missing_imports = true  # Ignore missing pkg_resources (fallback for old Python)

[[tool.mypy.overrides]]
module = "Foundation"
ignore_missing_imports = true  # PyObjC Foundation framework (macOS native)

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: marks tests as benchmark tests (deselect with '-m \"not benchmark\"')",
]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
    # Suboprocess calls
    "S607",
    "S603",
    # Unused unpacks are fine
    "RUF059",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.deptry]
extend_exclude = ["tests", "scripts"]

[tool.deptry.per_rule_ignores]
DEP004 = ["rumps", "AppKit"]  # Optional dependency group (macos-app)
DEP003 = ["pkg_resources"]  # Transitive dependency (setuptools), used as fallback
